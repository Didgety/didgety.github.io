- title: Selected projects
  type: time_table
  contents:
  - title: <a href="https://github.com/Didgety/q3hack26-team-bells-pair">Temporal calibration for a Steane memory</a>
    description:
    - Wrote the Qiskit implementation for Team Bells Pair at Qompute 2026. Simulated repeated correction in a seven-qubit
      Steane memory, implemented independent calibration circuits, and compared four decoders on held-out records.
  - title: <a href="/blog/2026/spectator-qubit-dynamics/">Spectator-qubit dynamics on IBM Fez</a>
    description:
    - Extended a USC course project into a three-job IBM Fez experiment. Reconstructed a central qubit's state
      and measured a trace-distance revival under coherent exchange and a decrease in the spectator-reset control.
  - title: <a href="https://github.com/Qiskit/qiskit/pull/15390">Qiskit circuit library and transpiler</a>
    description:
    - Proposed a Rust qDRIFT implementation for the C API and collaborated on its follow-up. Submitted separate
      changes for delay padding, classical type logic, and Windows library discovery.
  - title: <a href="/assets/pdf/Jai_Veilleux_CV.pdf">Gate-model QAOA for binary image denoising</a>
    description:
    - USC graduate course project. Mapped a restricted Boltzmann machine denoising objective to an Ising Hamiltonian
      and compared exact optimization, Aer simulation, and IBM hardware.
  - title: <a href="https://github.com/Didgety/samplableset-rs">SamplableSet for Rust</a>
    description:
    - Ported a weighted-sampling data structure from C++ to Rust. Used composition-rejection sampling with dynamically
      updated weights.
  - title: <a href="https://github.com/Didgety/qpgf">qpgf</a>
    description:
    - UVM course prototype for exploring distributions of assumed gate-error counts with probability generating
      functions and calibration-derived inputs.
  - title: <a href="/assets/pdf/Jai_Veilleux_CV.pdf">Independent study in quantum computation</a>
    description:
    - Implemented quantum circuit Born machines and a quantum Hamiltonian-based model and presented the project
      at the December 2024 UVM CS Fair.
  - title: <a href="/blog/2023/qkd_research_project/">Optical demonstration of BB84</a>
    description:
    - Built an Arduino-controlled optical link with software-simulated polarization choices. Presented the project
      at the Edmonds College Undergraduate Research Symposium.
